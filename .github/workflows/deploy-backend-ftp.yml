name: Deploy Laravel Backend to cPanel/VPS via FTP

# Trigger the workflow when a push is made to the main branch
on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      # Step for setting up PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, sqlite, pdo_sqlite
          
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader

      - name: Prepare SQLite Database for Static Build
        run: |
          touch database/database.sqlite
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan migrate --force
          php artisan db:seed --class=FooterSettingSeeder --force
          php artisan db:seed --class=DemoDataSeeder --force

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and Export Frontend
        run: npm run build:prod

      # Sync files via FTP
      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/frontend/**
            .env
            .env.example
            tests/**
            phpunit.xml
            README.md
